location = /command-news/feed.json {
    proxy_pass http://127.0.0.1:3011;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
}
location = /command-news/status.json {
    proxy_pass http://127.0.0.1:3011;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
}
location = /command-news/health {
    proxy_pass http://127.0.0.1:3011;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
}
location /command-news/ {
    return 404;
}
